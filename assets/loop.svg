<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="agent loop">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00c6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16232e"/>
      <stop offset="100%" stop-color="#0d1419"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="lane" d="M 205 100 H 320 A 30 30 0 0 1 350 70 H 400 A 30 30 0 0 0 430 100 H 620 A 30 30 0 0 1 650 130 H 700" fill="none"/>
  </defs>

  <rect width="900" height="200" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9">
    <rect x="40" y="68" width="165" height="64" rx="12" fill="url(#box)" stroke="#1f3a4d"/>
    <text x="122" y="105" text-anchor="middle" fill="#00c6ff">reason</text>

    <rect x="367" y="68" width="165" height="64" rx="12" fill="url(#box)" stroke="#1f3a4d"/>
    <text x="449" y="105" text-anchor="middle" fill="#00c6ff">tool call</text>

    <rect x="694" y="68" width="165" height="64" rx="12" fill="url(#box)" stroke="#1f3a4d"/>
    <text x="776" y="105" text-anchor="middle" fill="#00c6ff">observe</text>
  </g>

  <path d="M 205 100 H 320 A 30 30 0 0 1 350 70 H 400 A 30 30 0 0 0 430 100 H 620 A 30 30 0 0 1 650 130 H 700"
        fill="none" stroke="url(#edge)" stroke-width="1.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <path d="M 695 82 V 150 Q 695 168 675 168 H 500 Q 482 168 482 150" fill="none" stroke="#1f3a4d" stroke-width="1.2" stroke-dasharray="4 8"/>

  <circle r="4" fill="#00c6ff" filter="url(#glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#lane"/>
    </animateMotion>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b7183">
    <text x="256" y="128" text-anchor="middle">step &#8804; 8</text>
    <text x="776" y="168" text-anchor="middle">budget</text>
  </g>
</svg>
