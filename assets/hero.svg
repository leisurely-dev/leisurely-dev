<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="leisurely — agents, inference, evals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e12"/>
      <stop offset="55%" stop-color="#0e1a24"/>
      <stop offset="100%" stop-color="#10314a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00c6ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e12" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#05080b" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b3547" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#halo)"/>

  <path d="M0,196 C 170,158 330,224 560,202 C 800,179 980,225 1200,192 L1200,260 L0,260 Z" fill="url(#wave1)"/>
  <path d="M0,214 C 200,182 380,236 620,216 C 860,196 1010,238 1200,210 L1200,260 L0,260 Z" fill="url(#wave2)"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="128" font-size="74" font-weight="700" letter-spacing="-1.5" fill="#f2f8fc">leisurely</text>
    <text x="600" y="166" font-size="19" letter-spacing="2.5" fill="#59c8ea" opacity="0.95">AGENTS &#183; INFERENCE &#183; EVALS</text>
  </g>
</svg>
